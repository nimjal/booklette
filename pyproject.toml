[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "booklette"
version = "0.1.0"
description = "Turn a page-by-page PDF into a printable, foldable booklet."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Nimit Jalan", email = "hi@nimit.is-a.dev" }]
keywords = ["pdf", "booklet", "imposition", "printing", "duplex", "saddle-stitch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Printing",
    "Topic :: Utilities",
]
dependencies = ["pypdf>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5", "build>=1.0", "twine>=5.0"]

[project.scripts]
booklette = "booklette.cli:main"

[project.urls]
Homepage = "https://github.com/nimjal/booklette"
Repository = "https://github.com/nimjal/booklette"
Issues = "https://github.com/nimjal/booklette/issues"
Changelog = "https://github.com/nimjal/booklette/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
booklette = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Examples print things and re-import for clarity; keep them beginner-friendly.
"examples/*" = ["T201"]
