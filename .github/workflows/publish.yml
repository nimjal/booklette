# Publishes a release to PyPI when a version tag is pushed.
#
# Setup, once: create a "pypi" environment in the repository settings and add
# this workflow as a trusted publisher on PyPI
# (https://docs.pypi.org/trusted-publishers/). No API token is stored anywhere.
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Nothing in the release path needs to write to the repository.
permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      # Actions on the release path are pinned to commit SHAs: a tag like @v4
      # can be moved to point at new code, and anything running here shapes the
      # artifact that ends up on PyPI. Dependabot bumps these.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build twine
      - name: Build
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distribution
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
